name: poppy-treats
services:
- name: web
  source_dir: /
  github:
    branch: main
    deploy_on_push: true
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  build_command: npm run build
  health_check:
    http_path: /api/health
  envs:
  - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: NODE_ENV
    value: production
    scope: RUN_AND_BUILD_TIME
  - key: PORT
    value: "3000"
    scope: RUN_TIME
  routes:
  - path: /
static_sites: []
